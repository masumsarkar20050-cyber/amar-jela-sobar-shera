.progress{

}

.progress-bar{

.buttons{

button{

.share{

.reset{

}

h2{

}

.grid{

  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  border:1px solid #e9efec;
}

.photo{

  font-size:58px;
}

.card-body{
  padding:16px;
}

.card h3{
  font-size:19px;
  margin-bottom:7px;
}

.category{
  display:inline-block;
  font-size:12px;
  background:#e7f5ef;
  color:#00704f;
  padding:5px 9px;
  border-radius:20px;
  margin-bottom:9px;
}

.card p{
  font-size:14px;
  line-height:1.6;
  color:#555;
  min-height:65px;
}

.map{
  display:inline-block;
  margin-top:10px;
  color:#006a4e;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}

.visit{
  display:block;
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  background:#f1f5f3;
  cursor:pointer;
}

.visit input{
  transform:scale(1.25);
  margin-right:8px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  background:#f8fbfa;
  border-radius:15px;

}

footer{
  text-align:center;
  padding:25px 15px;
  color:#666;
  font-size:13px;
}

@media(max-width:800px){
  .grid{

}

@media(max-width:550px){

  }

  .grid{
