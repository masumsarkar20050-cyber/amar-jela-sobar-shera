<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আমার জেলা সবার সেরা 🇧🇩</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .hero {
      background: #006a4e;
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 34px;
      margin: 0 0 12px;
    }

    .hero p {
      font-size: 17px;
      margin-bottom: 25px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
      background: white;
    }

    .place {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .place input {
      width: 20px;
      height: 20px;
    }

    .progress {
      background: #ddd;
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #006a4e;
      transition: 0.3s;
    }

    .result {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .share {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006a4e;
      color: white;
      font-size: 16px;
      margin-top: 18px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>🇧🇩 আমার জেলা সবার সেরা</h1>
    <p>আপনার জেলার কতটা ঘুরেছেন?</p>
  </section>

  <div class="container">

    <div class="card">

      <h2>📍 আপনার জেলা নির্বাচন করুন</h2>

      <select id="district">

        <option value="">-- জেলা নির্বাচন করুন --</option>

        <!-- ঢাকা বিভাগ -->
        <option value="dhaka">ঢাকা</option>
        <option value="faridpur">ফরিদপুর</option>
        <option value="gazipur">গাজীপুর</option>
        <option value="gopalganj">গোপালগঞ্জ</option>
        <option value="kishoreganj">কিশোরগঞ্জ</option>
        <option value="madaripur">মাদারীপুর</option>
        <option value="manikganj">মানিকগঞ্জ</option>
        <option value="munshiganj">মুন্সিগঞ্জ</option>
        <option value="narayanganj">নারায়ণগঞ্জ</option>
        <option value="narshingdi">নরসিংদী</option>
        <option value="rajbari">রাজবাড়ী</option>
        <option value="shariatpur">শরীয়তপুর</option>
        <option value="tangail">টাঙ্গাইল</option>

        <!-- চট্টগ্রাম বিভাগ -->
        <option value="bandarban">বান্দরবান</option>
        <option value="brahmanbaria">ব্রাহ্মণবাড়িয়া</option>
        <option value="chandpur">চাঁদপুর</option>
        <option value="chattogram">চট্টগ্রাম</option>
        <option value="cumilla">কুমিল্লা</option>
        <option value="coxsbazar">কক্সবাজার</option>
        <option value="feni">ফেনী</option>
        <option value="khagrachhari">খাগড়াছড়ি</option>
        <option value="lakshmipur">লক্ষ্মীপুর</option>
        <option value="noakhali">নোয়াখালী</option>
        <option value="rangamati">রাঙ্গামাটি</option>

        <!-- রাজশাহী বিভাগ -->
        <option value="bogura">বগুড়া</option>
        <option value="joypurhat">জয়পুরহাট</option>
        <option value="naogaon">নওগাঁ</option>
        <option value="natore">নাটোর</option>
        <option value="chapainawabganj">চাঁপাইনবাবগঞ্জ</option>
        <option value="pabna">পাবনা</option>
        <option value="rajshahi">রাজশাহী</option>
        <option value="sirajganj">সিরাজগঞ্জ</option>

        <!-- খুলনা বিভাগ -->
        <option value="bagerhat">বাগেরহাট</option>
        <option value="chuadanga">চুয়াডাঙ্গা</option>
        <option value="jashore">যশোর</option>
        <option value="jhenaidah">ঝিনাইদহ</option>
        <option value="khulna">খুলনা</option>
        <option value="kushtia">কুষ্টিয়া</option>
        <option value="magura">মাগুরা</option>
        <option value="meherpur">মেহেরপুর</option>
        <option value="narail">নড়াইল</option>
        <option value="satkhira">সাতক্ষীরা</option>

        <!-- বরিশাল বিভাগ -->
        <option value="barguna">বরগুনা</option>
        <option value="barishal">বরিশাল</option>
        <option value="bhola">ভোলা</option>
        <option value="jhalokathi">ঝালকাঠি</option>
        <option value="patuakhali">পটুয়াখালী</option>
        <option value="pirojpur">পিরোজপুর</option>

        <!-- সিলেট বিভাগ -->
        <option value="habiganj">হবিগঞ্জ</option>
        <option value="moulvibazar">মৌলভীবাজার</option>
        <option value="sunamganj">সুনামগঞ্জ</option>
        <option value="sylhet">সিলেট</option>

        <!-- রংপুর বিভাগ -->
        <option value="dinajpur">দিনাজপুর</option>
        <option value="gaibandha">গাইবান্ধা</option>
        <option value="kurigram">কুড়িগ্রাম</option>
        <option value="lalmonirhat">লালমনিরহাট</option>
        <option value="nilphamari">নীলফামারী</option>
        <option value="panchagarh">পঞ্চগড়</option>
        <option value="rangpur">রংপুর</option>
        <option value="thakurgaon">ঠাকুরগাঁও</option>

        <!-- ময়মনসিংহ বিভাগ -->
        <option value="jamalpur">জামালপুর</option>
        <option value="mymensingh">ময়মনসিংহ</option>
        <option value="netrokona">নেত্রকোণা</option>
        <option value="sherpur">শেরপুর</option>

      </select>

    </div>


    <div class="card" id="placesCard" style="display:none;">

      <h2 id="districtName"></h2>

      <div id="places"></div>

      <h3>🎯 আপনার ভ্রমণ অগ্রগতি</h3>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="result" id="result">
        0 / 0 স্থান ঘুরেছেন
      </div>

      <button class="share" onclick="shareResult()">
        📤 আমার ভ্রমণ শেয়ার করুন
      </button>

    </div>

  </div>


  <div class="footer">
    © 2026 আমার জেলা সবার সেরা 🇧🇩
  </div>


<script>

const data = {

  dinajpur: {
    name: "📍 দিনাজপুর",
    places: [
      "কান্তজিউ মন্দির",
      "রামসাগর",
      "নয়াবাদ মসজিদ",
      "সীতাকোট বিহার",
      "স্বপ্নপুরী"
    ]
  },

  dhaka: {
    name: "📍 ঢাকা",
    places: []
  },

  chattogram: {
    name: "📍 চট্টগ্রাম",
    places: []
  },

  rajshahi: {
    name: "📍 রাজশাহী",
    places: []
  },

  rangpur: {
    name: "📍 রংপুর",
    places: []
  },

  sylhet: {
    name: "📍 সিলেট",
    places: []
  },

  coxsbazar: {
    name: "📍 কক্সবাজার",
    places: []
  }

};


const district = document.getElementById("district");


district.addEventListener("change", function() {

  const selected = this.value;

  if (!selected) {

    document.getElementById("placesCard").style.display = "none";

    return;

  }

  const info = data[selected];

  document.getElementById("placesCard").style.display = "block";

  document.getElementById("districtName").innerText =
    info ? info.name : "📍 " + this.options[this.selectedIndex].text;

  const placesDiv = document.getElementById("places");

  placesDiv.innerHTML = "";


  if (!info || info.places.length === 0) {

    placesDiv.innerHTML =
      "<p>🚧 এই জেলার স্থানগুলোর তালিকা খুব শিগগিরই যোগ করা হবে।</p>";

    document.getElementById("progressBar").style.width = "0%";

    document.getElementById("result").innerText =
      "0 / 0 স্থান ঘুরেছেন";

    return;

  }


  info.places.forEach((place) => {

    placesDiv.innerHTML += `

      <label class="place">

        <input
          type="checkbox"
          class="placeCheck"
          onchange="updateProgress()"
        >

        <span>${place}</span>

      </label>

    `;

  });

  updateProgress();

});


function updateProgress() {

  const checks =
    document.querySelectorAll(".placeCheck");

  const total = checks.length;

  const visited =
    document.querySelectorAll(".placeCheck:checked").length;

  const percent =
    total === 0
      ? 0
      : Math.round((visited / total) * 100);


  document.getElementById("progressBar").style.width =
    percent + "%";


  document.getElementById("result").innerText =
    `${visited} / ${total} স্থান ঘুরেছেন — ${percent}%`;

}


function shareResult() {

  const result =
    document.getElementById("result").innerText;

  const districtName =
    document.getElementById("districtName").innerText;


  const text =
    `🇧🇩 আমার জেলা সবার সেরা\n\n` +
    `${districtName}\n` +
    `আমি ${result}\n\n` +
    `আপনি আপনার জেলার কতটা ঘুরেছেন?`;


  if (navigator.share) {

    navigator.share({

      title: "আমার জেলা সবার সেরা",

      text: text

    });

  } else {

    alert(text);

  }

}

</script>

</body>
      </html>
