header{

.progressBox{

}

.progressTop{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:8px;
}

.progress{
    height:14px;
    background:#dce8e3;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:#008f68;
    transition:.3s;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;

}

.share{
    background:#006a4e;
    color:white;
}

.reset{
    background:#eee;
}

h2{
    margin:25px 0 15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px #00000012;
    border:1px solid #e8efec;
}

.cardTop{
    height:120px;

}

.cardBody{
    padding:16px;
}

.card h3{
    margin:5px 0 8px;
    font-size:19px;
}

.category{
    display:inline-block;
    background:#e7f5ef;
    color:#006a4e;
    border-radius:20px;
    padding:5px 9px;
    font-size:12px;
}

.card p{
    color:#555;
    font-size:14px;
    line-height:1.6;
    min-height:60px;
}

.map{
    display:block;
    color:#006a4e;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
    margin:8px 0;
}

.visit{
    display:block;
    background:#f1f5f3;
    padding:11px;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

.visit input{
    transform:scale(1.2);

}

.empty{
    background:white;
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    margin-top:20px;
}

footer{
    text-align:center;
    color:#666;
    padding:20px;
    font-size:13px;
}

@media(max-width:800px){

@media(max-width:550px){

/* ================================
   জেলা নির্বাচন
================================ */

const districtSelect = document.getElementById("district");
const content = document.getElementById("content");

const progressBox = document.getElementById("progressBox");
const progressText = document.getElementById("progressText");
const percent = document.getElementById("percent");
const progressBar = document.getElementById("progressBar");

/* ================================
   Local Storage
================================ */

function getKey(district){
    return "visited_" + district;
}

function getVisited(district){
    try{
        return JSON.parse(
            localStorage.getItem(getKey(district))
        ) || [];
    }catch(e){
        return [];
    }
}

function saveVisited(district, visited){
    localStorage.setItem(
        getKey(district),
        JSON.stringify(visited)
    );
}

/* ================================
   জেলা নির্বাচন
================================ */

districtSelect.addEventListener("change", function(){

    const district = this.value;

    if(!district){

        content.innerHTML = `
        <div class="empty">
            <h2>🇧🇩 একটি জেলা নির্বাচন করুন</h2>
            <p>
                জেলা নির্বাচন করলেই সেই জেলার
                দর্শনীয় স্থানগুলো দেখাবে।
            </p>
        </div>`;

        progressBox.style.display = "none";

        return;
    }

    showDistrict(district);
});

/* ================================
   জেলা দেখানো
================================ */

function showDistrict(district){

    const districtPlaces = places[district] || [];

    if(districtPlaces.length === 0){

        content.innerHTML = `
        <div class="empty">
            <h2>😔 তথ্য পাওয়া যায়নি</h2>
            <p>
                এই জেলার জায়গার তথ্য এখনো
                যোগ করা হয়নি।
            </p>
        </div>`;

        progressBox.style.display = "none";

        return;
    }

    const visited = getVisited(district);

    let html = `
        <h2>📍 ${district} জেলার দর্শনীয় স্থান</h2>

        <div class="grid">
    `;

    districtPlaces.forEach(function(place, index){

        const name = place[0];
        const icon = place[1];
        const category = place[2];
        const description = place[3];

        const checked =
            visited.includes(index)
            ? "checked"
            : "";

        const mapUrl =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
                name + ", " +
                district +
                ", Bangladesh"
            );

        html += `
        <div class="card">

            <div class="cardTop">
                ${icon}
            </div>

            <div class="cardBody">

                <h3>${name}</h3>

                <span class="category">
                    ${category}
                </span>

                <p>
                    ${description}
                </p>

                <a
                    class="map"
                    href="${mapUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📍 Google Maps
                </a>

                <label class="visit">

                    <input
                        type="checkbox"
                        class="visitCheck"
                        data-index="${index}"
                        ${checked}
                    >

                    আমি এখানে ঘুরেছি ✅

                </label>

            </div>

        </div>`;
    });

    html += `</div>`;

    content.innerHTML = html;

    progressBox.style.display = "block";

    document
        .querySelectorAll(".visitCheck")
        .forEach(function(checkbox){

            checkbox.addEventListener(
                "change",
                function(){
                    updateVisited(district);
                }
            );

        });

    updateProgress(district);
}

/* ================================
   Visited Update
================================ */

function updateVisited(district){

    const visited = [];

    document
        .querySelectorAll(".visitCheck")
        .forEach(function(checkbox){

            if(checkbox.checked){

                visited.push(
                    Number(checkbox.dataset.index)
                );

            }

        });

    saveVisited(district, visited);

    updateProgress(district);
}

/* ================================
   Progress Update
================================ */

function updateProgress(district){

    const districtPlaces =
        places[district] || [];

    const visited =
        getVisited(district);

    const total =
        districtPlaces.length;

    const done =
        visited.length;

    const percentage =
        total
        ? Math.round((done / total) * 100)
        : 0;

    progressText.innerText =
        `${done}/${total} জায়গা`;

    percent.innerText =
        `${percentage}%`;

    progressBar.style.width =
        `${percentage}%`;
}

/* ================================
   Reset
================================ */

function resetDistrict(){

    const district =
        districtSelect.value;

    if(!district){

        alert(
            "আগে একটি জেলা নির্বাচন করুন।"
        );

        return;
    }

    const confirmReset =
        confirm(
            `${district} জেলার ভ্রমণ অগ্রগতি Reset করতে চান?`
        );

    if(!confirmReset){
        return;
    }

    localStorage.removeItem(
        getKey(district)
    );

    showDistrict(district);
}

/* ================================
   Share
================================ */

async function shareResult(){

    const district =
        districtSelect.value;

    if(!district){

        alert(
            "আগে একটি জেলা নির্বাচন করুন।"
        );

        return;
    }

    const districtPlaces =
        places[district] || [];

    const visited =
        getVisited(district);

    const total =
        districtPlaces.length;

    const done =
        visited.length;

    const percentage =
        total
        ? Math.round((done / total) * 100)
        : 0;

    const text =
`🇧🇩 আমার জেলা সবার সেরা

📍 জেলা: ${district}

🗺️ ঘোরা হয়েছে: ${done}/${total} জায়গা

📊 অগ্রগতি: ${percentage}%

নিজের জেলা থেকে শুরু হোক বাংলাদেশের ৬৪ জেলা ঘোরার গল্প ❤️`;

    if(navigator.share){

        try{

            await navigator.share({
                title: "আমার জেলা সবার সেরা",
                text: text
            });

        }catch(error){

            // Share cancelled

        }

    }else{

        try{

            await navigator.clipboard.writeText(text);

            alert(
                "অগ্রগতির লেখা Copy হয়েছে। এখন Facebook-এ Paste করতে পারো।"
            );

        }catch(error){

            alert(text);

        }
    }
}

</script>
