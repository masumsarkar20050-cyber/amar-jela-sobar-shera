<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার জেলা সবার সেরা 🇧🇩</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .hero {
      background: #006a4e;
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 34px;
      margin: 0 0 12px;
    }

    .hero p {
      font-size: 17px;
      margin-bottom: 25px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    .place {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .place input {
      width: 20px;
      height: 20px;
    }

    .progress {
      background: #ddd;
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #006a4e;
      transition: 0.3s;
    }

    .result {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .share {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006a4e;
      color: white;
      font-size: 16px;
      margin-top: 18px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>🇧🇩 আমার জেলা সবার সেরা</h1>
    <p>আপনার জেলার কতটা ঘুরেছেন?</p>
  </section>

  <div class="container">

    <div class="card">
      <h2>📍 আপনার জেলা নির্বাচন করুন</h2>

      <select id="district">
        <option value="">-- জেলা নির্বাচন করুন --</option>
        <option value="dinajpur">দিনাজপুর</option>
      </select>
    </div>

    <div class="card" id="placesCard" style="display:none;">

      <h2 id="districtName"></h2>

      <div id="places"></div>

      <h3>🎯 আপনার ভ্রমণ অগ্রগতি</h3>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="result" id="result">
        0 / 0 স্থান ঘুরেছেন
      </div>

      <button class="share" onclick="shareResult()">
        📤 আমার ভ্রমণ শেয়ার করুন
      </button>

    </div>

  </div>

  <div class="footer">
    © 2026 আমার জেলা সবার সেরা 🇧🇩
  </div>


<script>

const data = {

  dinajpur: {
    name: "📍 দিনাজপুর",
    places: [
      "কান্তজিউ মন্দির",
      "রামসাগর",
      "নয়াবাদ মসজিদ",
      "সীতাকোট বিহার",
      "স্বপ্নপুরী"
    ]
  }

};

const district = document.getElementById("district");

district.addEventListener("change", function() {

  const selected = this.value;

  if (!selected) {
    document.getElementById("placesCard").style.display = "none";
    return;
  }

  const info = data[selected];

  document.getElementById("placesCard").style.display = "block";

  document.getElementById("districtName").innerText = info.name;

  const placesDiv = document.getElementById("places");

  placesDiv.innerHTML = "";

  info.places.forEach((place, index) => {

    placesDiv.innerHTML += `
      <label class="place">
        <input type="checkbox" class="placeCheck" onchange="updateProgress()">
        <span>${place}</span>
      </label>
    `;

  });

  updateProgress();

});


function updateProgress() {

  const checks = document.querySelectorAll(".placeCheck");

  const total = checks.length;

  const visited = document.querySelectorAll(".placeCheck:checked").length;

  const percent = total === 0 ? 0 : Math.round((visited / total) * 100);

  document.getElementById("progressBar").style.width = percent + "%";

  document.getElementById("result").innerText =
    `${visited} / ${total} স্থান ঘুরেছেন — ${percent}%`;

}


function shareResult() {

  const result = document.getElementById("result").innerText;

  const text =
    `🇧🇩 আমার জেলা সবার সেরা\n\n` +
    `আমি আমার জেলার ${result}\n\n` +
    `আপনি আপনার জেলার কতটা ঘুরেছেন?`;

  if (navigator.share) {

    navigator.share({
      title: "আমার জেলা সবার সেরা",
      text: text
    });

  } else {

    alert(text);

  }

}

</script>

</body>
  </html>
